name: Deploy LogTail to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Blazor WASM
        run: |
          dotnet publish -c Release -o ./publish

      # ── Fix base href pour GitHub Pages ────────────────────────
      - name: Fix base href
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO_NAME/\" />|g" \
            ./publish/wwwroot/index.html

      # ── Ajouter l'icône SVG dans index.html de Blazor ──────────
      - name: Add favicon to Blazor app
        run: |
          FAVICON='<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='"'"'http://www.w3.org/2000/svg'"'"' viewBox='"'"'0 0 32 32'"'"'%3E%3Crect width='"'"'32'"'"' height='"'"'32'"'"' rx='"'"'7'"'"' fill='"'"'%230078D4'"'"'/%3E%3Crect x='"'"'8'"'"' y='"'"'7'"'"' width='"'"'16'"'"' height='"'"'2.5'"'"' rx='"'"'1.2'"'"' fill='"'"'white'"'"'/%3E%3Crect x='"'"'8'"'"' y='"'"'12'"'"' width='"'"'16'"'"' height='"'"'2.5'"'"' rx='"'"'1.2'"'"' fill='"'"'white'"'"'/%3E%3Crect x='"'"'8'"'"' y='"'"'17'"'"' width='"'"'11'"'"' height='"'"'2.5'"'"' rx='"'"'1.2'"'"' fill='"'"'white'"'"'/%3E%3Ccircle cx='"'"'23'"'"' cy='"'"'23'"'"' r='"'"'6'"'"' fill='"'"'%2316a34a'"'"'/%3E%3Cpath d='"'"'M20 23l2 2 4-4'"'"' stroke='"'"'white'"'"' stroke-width='"'"'1.5'"'"' stroke-linecap='"'"'round'"'"' stroke-linejoin='"'"'round'"'"' fill='"'"'none'"'"'/%3E%3C/svg%3E"/>'
          sed -i "s|<title>LogTail</title>|<title>LogTail</title>\n    $FAVICON|g" \
            ./publish/wwwroot/index.html

      # ── Renommer index.html Blazor en app.html ──────────────────
      # La landing page sera la vraie page d'accueil (index.html)
      - name: Rename Blazor index to app.html
        run: mv ./publish/wwwroot/index.html ./publish/wwwroot/app.html

      # ── Copier landing.html comme nouvelle page d'accueil ───────
      - name: Set landing.html as homepage
        run: |
          # Met à jour le lien "Ouvrir l'application" pour pointer vers app.html
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          sed 's|href="./index.html"|href="./${{ github.repository_owner }}.github.io/$REPO_NAME/app.html"|g' landing.html > ./publish/wwwroot/index.html
          # Version simple : juste copier landing.html en index.html
          cp landing.html ./publish/wwwroot/index.html
          # Mettre à jour le lien vers l'app Blazor
          sed -i 's|href="./index.html"|href="./app.html"|g' ./publish/wwwroot/index.html

      # ── 404.html pointe vers landing (pas Blazor) ───────────────
      - name: Create 404.html
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      # ── .nojekyll ───────────────────────────────────────────────
      - name: Add .nojekyll
        run: touch ./publish/wwwroot/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './publish/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
