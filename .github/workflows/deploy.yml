name: Deploy LogTail to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Blazor WASM
        run: |
          dotnet publish -c Release -o ./publish

      # ── Fix base href pour GitHub Pages ────────────────────────
      # Remplace <base href="/" /> par <base href="/NOM_REPO/" />
      - name: Fix base href
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO_NAME/\" />|g" \
            ./publish/wwwroot/index.html

      # ── Fichier 404.html pour le routing SPA ───────────────────
      - name: Create 404.html for SPA routing
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      # ── Fichier .nojekyll (évite que GitHub ignore _framework) ─
      - name: Add .nojekyll
        run: touch ./publish/wwwroot/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './publish/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
